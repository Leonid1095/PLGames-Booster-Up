name: Client Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Download WinDivert
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip" -OutFile windivert.zip
          Expand-Archive windivert.zip -DestinationPath windivert-extracted
          New-Item -ItemType Directory -Force -Path client/src-tauri/resources/windivert
          Copy-Item windivert-extracted/WinDivert-2.2.2-A/x64/* client/src-tauri/resources/windivert/

      - name: Pre-place WinDivert next to exe for NSIS bundling
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path client/src-tauri/target/release
          Copy-Item client/src-tauri/resources/windivert/WinDivert.dll client/src-tauri/target/release/
          Copy-Item client/src-tauri/resources/windivert/WinDivert64.sys client/src-tauri/target/release/

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDIVERT_PATH: ${{ github.workspace }}/client/src-tauri/resources/windivert
        with:
          projectPath: client
          tagName: ${{ github.ref_name }}
          releaseName: "PLGames Booster ${{ github.ref_name }}"
          releaseBody: |
            ### What's New in ${{ github.ref_name }}
            - Transparent UDP interception via WinDivert (kernel-level, no proxy config)
            - PLG Protocol integration with relay servers
            - Multipath: packet duplication across 2 relay nodes + deduplication
            - Smart Monitor: automatic game detection & route optimization
            - Auto-updater: seamless updates from previous versions
            - Automatic fallback to localhost proxy if WinDivert unavailable
            - Admin privilege detection for WinDivert mode

            ### Install
            - **NSIS installer (.exe):** recommended for most users
            - **MSI installer (.msi):** for enterprise/silent deployment
            - **Portable (.zip):** no install, run from any folder (admin required for WinDivert)

            The app will auto-update from previous versions automatically.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $exePath = Get-ChildItem -Path "client/src-tauri/target/release" -Filter "*.exe" | Where-Object { $_.Name -notmatch "setup|uninstall" } | Select-Object -First 1
          if ($exePath) {
            $zipDir = "portable"
            New-Item -ItemType Directory -Force -Path $zipDir
            Copy-Item $exePath.FullName "$zipDir/PLGames Booster.exe"
            # WinDivert DLLs next to exe (required for LoadLibrary)
            Copy-Item "client/src-tauri/resources/windivert/WinDivert.dll" "$zipDir/"
            Copy-Item "client/src-tauri/resources/windivert/WinDivert64.sys" "$zipDir/"
            Compress-Archive -Path "$zipDir/*" -DestinationPath "PLGames.Booster_${{ github.ref_name }}_portable.zip"
          }

      - name: Upload portable ZIP
        if: hashFiles('PLGames.Booster_*_portable.zip') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: PLGames.Booster_*_portable.zip
