target-version = "py312"
line-length = 100

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
]
ignore = [
    "S101",  # assert used (OK in tests)
    "S105",  # hardcoded password (false positives on defaults)
    "S106",  # hardcoded password in argument
    "E712",  # comparison to True (needed for SQLAlchemy filters)
]

[lint.per-file-ignores]
"api/tests/*" = ["S"]
